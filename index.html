<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060807" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Provenance" />
  <title>Provenance — Real Food Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #060807;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #E8DEC8;
    }

    /* ── MAP ── */
    #map-img {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      z-index: 1;
      display: block;
    }

    #pins {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }

    /* ── HEADER ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: calc(env(safe-area-inset-top, 20px) + 36px) 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(to bottom, rgba(6,8,7,0.90) 0%, rgba(6,8,7,0) 100%);
      pointer-events: none;
    }

    #header h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.9rem;
      font-weight: 500;
      color: #f8f8f3;
      letter-spacing: 0.14em;
      line-height: 1;
    }

    #header p {
      font-size: 0.58rem;
      font-weight: 300;
      color: #f8f8f3;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 5px;
    }

    @media (max-width: 400px) {
      #seal-pill {
        font-size: 0.60rem;
        padding: 0 10px;
      }
    }

    @media (max-width: 600px) {
      .pin-dot { width: 5px !important; height: 5px !important; }
      .pin.approved .pin-dot { width: 7px !important; height: 7px !important; }
      .pin.market .pin-dot { width: 5px !important; height: 5px !important; }
    }



    /* ── PINS — FREE ── */
    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      -webkit-tap-highlight-color: transparent;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3D7A4A;
      border: 1px solid rgba(248,248,243,0.8);
      box-shadow: 0 0 6px 2px rgba(61,122,74,0.45);
      position: relative;
      z-index: 1;
      cursor: pointer;
      pointer-events: all;
      flex-shrink: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    .pin-pulse {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(46,84,56,0.28);
      animation: pulse-green 2.8s ease-out infinite;
      pointer-events: none;
    }

    /* ── PINS — PROVENANCE APPROVED ── */
    .pin.approved .pin-dot {
      background: #4A8A55 !important;
      box-shadow: 0 0 6px 2px rgba(74,138,85,0.45) !important;
    }
    .pin.approved .pin-pulse {
      background: rgba(74,138,85,0.28) !important;
    }

/* ── PROVENANCE FOUNDER — 20% larger pin ── */
    .pin[data-badge2="Provenance Founder"] .pin-dot {
      width: 8.4px !important;
      height: 8.4px !important;
      box-shadow: 0 0 6px 2px rgba(74,138,85,0.45) !important;
    }

    @keyframes pulse-green {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.75; }
      100% { transform: translate(-50%,-50%) scale(3.8); opacity: 0; }
    }

    .pin:active .pin-dot { transform: scale(1.45); }

    @keyframes pin-tap {
      0%   { transform: translate(-50%,-50%) scale(1); }
      30%  { transform: translate(-50%,-50%) scale(1.7); }
      60%  { transform: translate(-50%,-50%) scale(0.85); }
      100% { transform: translate(-50%,-50%) scale(1); }
    }

    .pin-dot.tapped {
      animation: pin-tap 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    /* ── PINS — TIER 1+ (paid) ── */
    .pin.tier-1 .pin-dot,
    .pin.tier-2 .pin-dot,
    .pin.tier-3 .pin-dot {
      width: 9px; height: 9px;
      background: #C48E28;
      border: 2px solid rgba(248,248,243,0.95);
      box-shadow: 0 0 16px 5px rgba(196,142,40,0.55), 0 0 6px 1px rgba(196,142,40,0.8);
    }
    .pin.tier-1 .pin-pulse,
    .pin.tier-2 .pin-pulse,
    .pin.tier-3 .pin-pulse {
      width: 9px; height: 9px;
      background: rgba(196,142,40,0.28);
      animation: pulse-orange 2.4s ease-out infinite;
    }

    @keyframes pulse-orange {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.85; }
      100% { transform: translate(-50%,-50%) scale(4.2); opacity: 0; }
    }


    /* ── OVERLAY ── */
    #overlay {
      position: fixed; inset: 0;
      z-index: 20;
      background: transparent;
      pointer-events: none;
      transition: background 0.3s ease;
    }
    #overlay.active {
      background: rgba(6,8,7,0.62);
      pointer-events: all;
    }

    /* ── PROVENANCE SEAL PILL ── */
    #seal-pill {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 22px);
      left: 20px;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #C4A44A;
      color: #060807;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      border-radius: 24px;
      height: 44px;
      padding: 0 14px;
      text-decoration: none;
      box-shadow: 0 4px 22px rgba(196,164,74,0.32);
      transition: opacity 0.2s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
    }

    #seal-pill:hover { opacity: 0.88; }
    #seal-pill:active { transform: scale(0.97); }

    /* ── MENU BUTTON ── */
    #menu-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 16px) + 14px);
      left: 18px;
      z-index: 120;
      width: 38px; height: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      pointer-events: auto;
    }

    #menu-btn span {
      display: block;
      width: 22px; height: 1.5px;
      background: #E8DEC8;
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s;
      transform-origin: center;
    }

    #menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* ── MENU OVERLAY ── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(6,8,7,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #E8DEC8;
      margin-bottom: 48px;
    }

    .menu-link {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 300;
      font-style: italic;
      color: #E8DEC8;
      letter-spacing: 0.5px;
      padding: 16px 0;
      text-decoration: none;
      border-bottom: 0.5px solid rgba(196,164,74,0.15);
      width: 260px;
      text-align: center;
      transition: color 0.2s;
    }

    .menu-link:last-of-type { border-bottom: none; }
    .menu-link:hover { color: #C4A44A; }

    .menu-tagline {
      position: absolute;
      bottom: 40px;
      font-size: 11px;
      color: #504838;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── CARD ── */
    #card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 30;
      background: #0E100D;
      border-radius: 18px 18px 0 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
      max-width: 560px;
      margin: 0 auto;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #card.open { transform: translateY(0); }

    .card-top {
      position: relative;
      padding-top: 1px;
    }

    .card-handle {
      width: 36px; height: 4px;
      border-radius: 2px;
      background: #1c2024;
      margin: 14px auto 0;
    }

    .card-close {
      position: absolute;
      top: 10px; right: 14px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .card-close:hover { background: rgba(255,255,255,0.09); }
    .card-close svg {
      width: 11px; height: 11px;
      stroke: #504838;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* Photo */
    .card-photo-wrap {
      width: 100%;
      height: 185px;
      background: #080a09;
      margin-top: 14px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-photo-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .card-photo-wrap .photo-placeholder svg {
      width: 34px; height: 34px;
      opacity: 0.08;
    }

    /* Photo strip */
    .card-photo-strip {
      display: flex;
      gap: 6px;
      padding: 8px 14px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .card-photo-strip::-webkit-scrollbar { display: none; }
    .card-photo-strip.hidden { display: none; }
    .strip-thumb {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s;
      background: #080a09;
    }
    .strip-thumb.active { border-color: #4A8A55; }
    .strip-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Body */
    .card-body {
      padding: 18px 22px calc(env(safe-area-inset-bottom, 16px) + 30px);
    }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-free {
      background: rgba(74,138,85,0.10);
      border: 1px solid rgba(74,138,85,0.28);
      color: #4A8A55;
    }
    .badge-free::before { background: #4A8A55; }
    .badge-paid {
      background: rgba(196,164,74,0.10);
      border: 1px solid rgba(196,164,74,0.32);
      color: #C4A44A;
    }
    .badge-paid::before { background: #C4A44A; }
    /* ── PINS — GOLD (Provenance Visited) ── */
    .pin.gold .pin-dot,
    .pin.approved.gold .pin-dot {
      width: 8.5px !important;
      height: 8.5px !important;
      background: #C4AA28 !important;
      border: 1px solid rgba(248,248,243,0.6) !important;
      box-shadow: 0 0 18px 6px rgba(196,170,40,0.55), 0 0 6px 2px rgba(196,170,40,0.8) !important;
    }
    .pin.gold .pin-pulse,
    .pin.approved.gold .pin-pulse {
      background: rgba(196,142,40,0.28) !important;
      animation: pulse-gold 2.4s ease-out infinite !important;
    }
    @keyframes pulse-gold {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.85; }
      100% { transform: translate(-50%,-50%) scale(4.2); opacity: 0; }
    }
    .pin.white .pin-dot {
      background: #F8F8F3 !important;
      box-shadow: 0 0 6px 2px rgba(248,248,243,0.2), 0 0 3px 1px rgba(248,248,243,0.3) !important;
    }
    .pin.white .pin-pulse {
      background: rgba(248,248,243,0.2) !important;
    }
    /* ── FARMERS MARKET PIN ── */
    .pin.market .pin-dot {
      width: 7px !important;
      height: 7px !important;
      background: #B0623A !important;
      border: 0.7px solid #E8DEC8 !important;
      box-shadow: 0 0 6px 2px rgba(176,98,58,0.45) !important;
    }
    .pin.market .pin-pulse {
      background: rgba(176,98,58,0.22) !important;
      animation: pulse-terracotta 2.8s ease-out infinite !important;
    }
    .pin.market.confirmed .pin-pulse {
      animation: pulse-terracotta 2.2s ease-out infinite !important;
      background: rgba(176,98,58,0.25) !important;
    }
    @keyframes pulse-terracotta {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3.5); opacity: 0; }
    }

    /* ── MARKET CARD — terracotta theme ── */
    .badge-market {
      background: rgba(176,98,58,0.12);
      border: 1px solid rgba(176,98,58,0.4);
      color: #C07050;
    }
    .badge-market::before { background: #B0623A; }
    .badge-confirmed {
      background: rgba(176,98,58,0.08);
      border: 1px solid rgba(176,98,58,0.3);
      color: #C07050;
      margin-left: 6px;
    }
    .badge-confirmed::before { background: #B0623A; }
    #card.market-card .card-product { color: #B0623A; }
    #card.market-card .card-profile-btn {
      background: #B0623A;
      color: #f8f8f3;
      box-shadow: 0 4px 22px rgba(176,98,58,0.3);
    }
    #card.market-card .strip-thumb.active { border-color: #B0623A; }

    /* ── MARKET CARD CONTENT ── */
    .card-hours {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 0.9rem;
      color: #E8DEC8;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .card-hours svg {
      width: 14px; height: 14px;
      flex-shrink: 0;
      stroke: #B0623A;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      margin-top: 2px;
    }
    .card-producers-label {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #504838;
      margin-bottom: 10px;
    }
    .card-producer-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .card-producer-entry:last-child { border-bottom: none; }
    .card-producer-name {
      font-size: 0.88rem;
      color: #E8DEC8;
    }
    .card-producer-link {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #B0623A;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.15s;
    }
    .card-producer-link:hover { opacity: 1; }

    /* ── MAP LEGEND ── */
    #map-legend {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 22px);
      right: 16px;
      z-index: 25;
      background: rgba(14,16,13,0.88);
      border: 0.5px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #504838;
    }
    .legend-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pin.black-border .pin-dot {
      border: 1px solid rgba(0,0,0,0.7) !important;
    }
    .pin.gold-border .pin-dot,
    .pin.approved.gold-border .pin-dot {
      width: 8.4px !important;
      height: 8.4px !important;
      border: 1px solid rgba(196,164,74,0.9) !important;
    }
    .pin.custom-gold .pin-dot,
    .pin.approved.custom-gold .pin-dot {
      background: #C4A44A !important;
      border: 1px solid rgba(255,255,255,0.8) !important;
      box-shadow: 0 0 14px 4px rgba(196,164,74,0.55), 0 0 5px 2px rgba(196,164,74,0.75) !important;
    }
    .pin.custom-gold .pin-pulse,
    .pin.approved.custom-gold .pin-pulse {
      background: rgba(196,164,74,0.25) !important;
    }
    .pin.teal .pin-dot {
      background: #2A7A6A !important;
      border: 1px solid rgba(196,164,74,0.8) !important;
      box-shadow: 0 0 14px 4px rgba(42,122,106,0.55), 0 0 5px 2px rgba(42,122,106,0.75) !important;
    }
    .pin.teal .pin-pulse {
      background: rgba(42,122,106,0.25) !important;
    }

    .badge-founder {
      background: rgba(248,248,243,0.08);
      border: 1px solid rgba(248,248,243,0.35);
      color: #f8f8f3;
    }
    .badge-founder::before { background: #f8f8f3; }

    /* ── MARKET CARD — white accent theme ── */
    .badge-market {
      background: rgba(248,248,243,0.08);
      border: 1px solid rgba(248,248,243,0.35);
      color: #f8f8f3;
    }
    .badge-market::before { background: #f8f8f3; }

    #card.market-card .card-product {
      color: #f8f8f3;
    }
    #card.market-card .strip-thumb.active {
      border-color: #f8f8f3;
    }
    #card.market-card .card-profile-btn {
      background: #f8f8f3;
      color: #060807;
      box-shadow: 0 4px 22px rgba(248,248,243,0.2);
    }

    #card-name {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 2rem;
      font-weight: 600;
      color: #f8f8f3;
      line-height: 1.05;
      margin-bottom: 5px;
    }

    .card-location {
      font-size: 0.67rem;
      color: #504838;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-product {
      font-size: 0.9rem;
      color: #C4A44A;
      margin-bottom: 14px;
    }

    .card-description {
      font-size: 0.92rem;
      color: #a8a090;
      line-height: 1.68;
      font-style: italic;
      margin-bottom: 20px;
    }

    .card-divider {
      height: 1px;
      background: #161a1d;
      margin-bottom: 16px;
    }

    .card-links { display: flex; flex-direction: column; gap: 11px; }

    .card-profile-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      padding: 0 20px;
      height: 44px;
      background: #C4A44A;
      border: none;
      border-radius: 24px;
      color: #060807;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 22px rgba(196,164,74,0.32);
      transition: opacity 0.2s, transform 0.2s;
    }
    .card-profile-btn:hover { opacity: 0.88; }
    .card-profile-btn:active { transform: scale(0.97); }

    .card-link {
      display: inline-flex;
      align-items: center;

  <!-- MAP LEGEND -->
  <div id="map-legend">

  <!-- CARD -->
  <div id="card">
    <div class="card-top">
      <div class="card-handle"></div>
      <button class="card-close" id="card-close" aria-label="Close">
        <svg viewBox="0 0 24 24">

    </div>

    <div class="card-photo-wrap" id="card-photo-wrap">
      <div class="photo-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f8f8f3" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>

      </div>
    </div>
    <div class="card-photo-strip hidden" id="card-photo-strip"></div>

    <div class="card-body">
      <div id="card-badge"></div>
      <h2 id="card-name"></h2>
      <p class="card-location" id="card-location"></p>
      <p class="card-product" id="card-product"></p>
      <p class="card-description hidden" id="card-description"></p>
      <div id="card-market-info" class="hidden">
        <div class="card-hours hidden" id="card-hours-row">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="card-hours-text"></span>
        </div>
        <p class="card-producers-label hidden" id="card-producers-label">Provenance producers at this market</p>
        <div id="card-producers-list"></div>
      </div>
      <div class="card-divider hidden" id="card-divider"></div>
      <div class="card-links hidden" id="card-links">
        <a class="card-link hidden" id="card-instagram" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
          </svg>
          <span id="card-instagram-handle"></span>
        </a>
        <a class="card-link hidden" id="card-website" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/>
          </svg>
          <span id="card-website-text"></span>
        </a>
      </div>
      <a class="card-link hidden" id="card-video" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
        </svg>
        <span>Producer Visit</span>
      </a>
      <a class="card-profile-btn hidden" id="card-profile" href="#">
        Provenance
      </a>
    </div>
  </div>

  <script>
    const mapImg = document.getElementById('map-img');

    // Geographic bounds of the map image
    // ── MAP CALIBRATION ──────────────────────────────────────────
    // Calibrated from Saltrock Dairy (52.699°N, -6.218°W) confirmed
    // at x=79.5%, y=63% of the rendered map image.
    //
    // Derived geographic bounds:
    //   East coast  lng ≈ -5.90°  → x = 85%
    //   West coast  lng ≈ -10.50° → x = 15%
    //   North       lat ≈ 55.40°  → y = 10%
    //   South       lat ≈ 51.40°  → y = 90%
    //
    // Scale: 15.217% per degree longitude, 20% per degree latitude
    // ─────────────────────────────────────────────────────────────
    const CAL = {
      refLng: -5.90,  refX: 85,   scaleX: 15.217,  // %/° west
      refLat: 55.40,  refY: 10,   scaleY: 20,       // %/° south
    };

    function latLngToPercent(lat, lng) {
      // Use slightly different horizontal anchor for landscape (PC) vs portrait (mobile)
      const isLandscape = window.innerWidth > window.innerHeight;
      const refX = isLandscape ? 82 : 85;
      const x = refX + (lng - CAL.refLng) * CAL.scaleX;
      const y = CAL.refY + (CAL.refLat - lat) * CAL.scaleY;
      return { x: x / 100, y: y / 100 };
    }

    function positionPins() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const iw = mapImg.naturalWidth;
      const ih = mapImg.naturalHeight;
      if (!iw || !ih) return;
      const scale = Math.min(vw / iw, vh / ih);
      const rw = iw * scale;
      const rh = ih * scale;
      const ox = (vw - rw) / 2;
      const oy = (vh - rh) / 2;
      const isLandscape = window.innerWidth > window.innerHeight;
      document.querySelectorAll('.pin').forEach(pin => {
        const useLandscape = isLandscape && pin.dataset.latDesktop && pin.dataset.lngDesktop;
        const lat = parseFloat(useLandscape ? pin.dataset.latDesktop : pin.dataset.lat);
        const lng = parseFloat(useLandscape ? pin.dataset.lngDesktop : pin.dataset.lng);
        const { x, y } = latLngToPercent(lat, lng);
        pin.style.left = (ox + x * rw - 20) + 'px';
        pin.style.top  = (oy + y * rh - 20) + 'px';
      });
    }

    mapImg.addEventListener('load', positionPins);
    if (mapImg.complete && mapImg.naturalWidth) {
      positionPins();
    } else if (mapImg.complete) {
      // naturalWidth not yet available — retry after decode
      mapImg.decode().then(positionPins).catch(() => {
        requestAnimationFrame(positionPins);
      });
    }
    window.addEventListener('resize', positionPins);

    // Apply tier class to each pin for colour styling
    // Apply is-new class if listed within the last 24 hours
    document.querySelectorAll('.pin').forEach(pin => {
      const tier = parseInt(pin.dataset.tier || '0');
      if (tier > 0) pin.classList.add('tier-' + tier);
      if (pin.dataset.listed) {
        const listed = new Date(pin.dataset.listed);
        if (Date.now() - listed.getTime() < 24 * 60 * 60 * 1000) {
          pin.classList.add('is-new');
        }
      }
    });

    const card    = document.getElementById('card');
    const overlay = document.getElementById('overlay');
    const applyBtn = document.getElementById('apply-btn');

    const TIER_LABELS = {
      0: { text: 'Free Listing',       cls: 'badge badge-free' },
      1: { text: 'Provenance Verified', cls: 'badge badge-paid' },
      2: { text: 'POV Verified',       cls: 'badge badge-paid' },
      3: { text: 'Provenance Seal',    cls: 'badge badge-paid' },
    };

    function openCard(pin) {
      const tier     = parseInt(pin.dataset.tier || '0');
      const isPaid   = tier >= 1;
      const isMarket = pin.classList.contains('market');

      // Apply/remove market card theme
      if (isMarket) {
        card.classList.add('market-card');
      } else {
        card.classList.remove('market-card');
      }

      // Badge
      let badgeHTML = '';
      if (isMarket) {
        badgeHTML = `<span class="badge badge-market">Farmers Market</span>`;
        if (pin.dataset.confirmed === 'true') {
          badgeHTML += `<span class="badge badge-confirmed">Personally Confirmed</span>`;
        }
      } else if (pin.dataset.badge2) {
        badgeHTML = `<span class="badge badge-founder">${pin.dataset.badge2}</span>`;
      }
      document.getElementById('card-badge').innerHTML = badgeHTML;

      document.getElementById('card-name').textContent     = pin.dataset.name;
      document.getElementById('card-location').textContent = pin.dataset.location;
      document.getElementById('card-product').textContent  = isMarket ? '' : (pin.dataset.product || '');

      // Photo + strip
      const photoWrap  = document.getElementById('card-photo-wrap');
      const photoStrip = document.getElementById('card-photo-strip');
      const allPhotos  = [
        pin.dataset.photo,
        ...(pin.dataset.photos ? pin.dataset.photos.split(',').map(s => s.trim()) : [])
      ].filter(Boolean);

      function showPhoto(src) {
        photoWrap.innerHTML = `<img src="${src}" alt="${pin.dataset.name}" />`;
        photoStrip.querySelectorAll('.strip-thumb').forEach(t => {
          t.classList.toggle('active', t.dataset.src === src);
        });
      }

      if (allPhotos.length > 0) {
        photoWrap.style.display = '';
        showPhoto(allPhotos[0]);
      } else if (isMarket) {
        photoWrap.style.display = 'none';
      } else {
        photoWrap.style.display = '';
        photoWrap.innerHTML = `<div class="photo-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="#f8f8f3" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
      }

      if (allPhotos.length > 1) {
        photoStrip.innerHTML = allPhotos.map((src, i) =>
          `<div class="strip-thumb${i === 0 ? ' active' : ''}" data-src="${src}">
            <img src="${src}" alt="" />
          </div>`
        ).join('');
        photoStrip.querySelectorAll('.strip-thumb').forEach(thumb => {
          thumb.addEventListener('click', () => showPhoto(thumb.dataset.src));
        });
        photoStrip.classList.remove('hidden');
      } else {
        photoStrip.innerHTML = '';
        photoStrip.classList.add('hidden');
      }

      const desc    = document.getElementById('card-description');
      const divider = document.getElementById('card-divider');
      const links   = document.getElementById('card-links');
      const marketInfo = document.getElementById('card-market-info');

      desc.classList.add('hidden');
      divider.classList.add('hidden');

      if (isMarket) {
        marketInfo.classList.remove('hidden');

        const hoursRow  = document.getElementById('card-hours-row');
        const hoursText = document.getElementById('card-hours-text');
        if (pin.dataset.hours) {
          hoursText.textContent = pin.dataset.hours;
          hoursRow.classList.remove('hidden');
        } else {
          hoursRow.classList.add('hidden');
        }

        const producersList  = document.getElementById('card-producers-list');
        const producersLabel = document.getElementById('card-producers-label');
        if (pin.dataset.producers) {
          const entries = pin.dataset.producers.split(',').map(s => s.trim()).filter(Boolean);
          producersList.innerHTML = entries.map(p => {
            const [name, url] = p.split('|');
            return `<div class="card-producer-entry">
              <span class="card-producer-name">${name}</span>
              ${url ? `<a class="card-producer-link" href="${url}">View →</a>` : ''}
            </div>`;
          }).join('');
          producersLabel.classList.remove('hidden');
        } else {
          producersList.innerHTML = '';
          producersLabel.classList.add('hidden');
        }
      } else {
        marketInfo.classList.add('hidden');
      }

      if (isPaid) {
        links.classList.remove('hidden');

        const igEl     = document.getElementById('card-instagram');
        const igHandle = pin.dataset.instagram;
        if (igHandle) {
          igEl.href = `https://instagram.com/${igHandle}`;
          document.getElementById('card-instagram-handle').textContent = `@${igHandle}`;
          igEl.classList.remove('hidden');
        } else {
          igEl.classList.add('hidden');
        }

        const wsEl  = document.getElementById('card-website');
        const wsUrl = pin.dataset.website;
        if (wsUrl) {
          wsEl.href = wsUrl;
          document.getElementById('card-website-text').textContent =
            wsUrl.replace(/^https?:\/\//, '');
          wsEl.classList.remove('hidden');
        } else {
          wsEl.classList.add('hidden');
        }
      } else {
        links.classList.add('hidden');
      }

      const videoEl = document.getElementById('card-video');
      if (pin.dataset.video) {
        videoEl.href = pin.dataset.video;
        videoEl.classList.remove('hidden');
      } else {
        videoEl.classList.add('hidden');
      }

      const profileEl = document.getElementById('card-profile');
      if (pin.dataset.profile) {
        profileEl.href = pin.dataset.profile;
        profileEl.classList.remove('hidden');
      } else {
        profileEl.classList.add('hidden');
      }

      // Reset pinch-zoom so card is fully visible on iOS
      const viewport = document.querySelector('meta[name=viewport]');
      viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
      requestAnimationFrame(() => {
        viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
      });

      card.classList.add('open');
      overlay.classList.add('active');
      if (applyBtn) applyBtn.style.display = 'none';
    }

    function closeCard() {
      card.classList.remove('open');
      card.classList.remove('market-card');
      overlay.classList.remove('active');
      if (applyBtn) applyBtn.style.display = '';
      document.getElementById('card-photo-wrap').style.display = '';
    }

    document.querySelectorAll('.pin').forEach(pin => {
      pin.querySelector('.pin-dot').addEventListener('click', e => {
        e.stopPropagation();
        const dot = e.currentTarget;
        dot.classList.remove('tapped');
        void dot.offsetWidth; // force reflow to restart animation
        dot.classList.add('tapped');
        dot.addEventListener('animationend', () => dot.classList.remove('tapped'), { once: true });
        openCard(pin);
      });
    });

    overlay.addEventListener('click', closeCard);
    document.getElementById('card-close').addEventListener('click', closeCard);

    // Swipe down to dismiss
    let touchStartY = 0;
    card.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    card.addEventListener('touchend', e => {
      if (e.changedTouches[0].clientY - touchStartY > 60) closeCard();
    }, { passive: true });


    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js?v=32');
    }

    function toggleMenu() {
      const btn = document.getElementById('menu-btn');
      const overlay = document.getElementById('menu-overlay');
      btn.classList.toggle('open');
      overlay.classList.toggle('open');
    }
  </script>
