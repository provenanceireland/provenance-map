<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  function fit() {
    document.querySelectorAll('.stage').forEach(function (st) {
      st.querySelector('.art').style.transform = 'scale(' + (st.clientWidth / 1080) + ')';
    });
  }
  window.addEventListener('resize', fit);
  fit();

  var say = function (m) { document.getElementById('s').textContent = m; };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var arts = Array.prototype.slice.call(document.querySelectorAll('.art'));

  async function render(art) {
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-20000px;top:0;width:1080px;height:1350px;overflow:hidden;';
    var clone = art.firstElementChild.cloneNode(true);
    host.appendChild(clone);
    document.body.appendChild(host);
    try {
      return await html2canvas(clone, { width: 1080, height: 1350, scale: 1, backgroundColor: '#1A1B18', useCORS: true, logging: false });
    } finally {
      host.remove();
    }
  }
  function toBlob(canvas) {
    return new Promise(function (res, rej) {
      canvas.toBlob(function (b) { b ? res(b) : rej(new Error('blank render')); }, 'image/png');
    });
  }
  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  document.getElementById('zip').addEventListener('click', async function () {
    var b = this; b.disabled = true;
    try {
      try { await document.fonts.ready; } catch (e) {}
      var zip = new JSZip();
      for (var i = 0; i < arts.length; i++) {
        say('Rendering ' + (i + 1) + ' of ' + arts.length + '...');
        var blob = await toBlob(await render(arts[i]));
        zip.file(arts[i].dataset.name, blob);
      }
      say('Packing the zip...');
      var out = await zip.generateAsync({ type: 'blob' });
      saveBlob(out, 'Provenance-Connect-New-Producers.zip');
      say('Done. One zip with all ' + arts.length + ' plates.');
    } catch (e) {
      say('Failed: ' + (e && e.message ? e.message : e));
    } finally { b.disabled = false; }
  });

  document.getElementById('loose').addEventListener('click', async function () {
    var b = this; b.disabled = true;
    var missed = [];
    try {
      try { await document.fonts.ready; } catch (e) {}
      for (var i = 0; i < arts.length; i++) {
        say('Saving ' + (i + 1) + ' of ' + arts.length + '...');
        try {
          saveBlob(await toBlob(await render(arts[i])), arts[i].dataset.name);
        } catch (e) { missed.push(i + 1); }
        await sleep(900);
      }
      say(missed.length ? ('Not saved: plate ' + missed.join(', plate ') + '. Use the button under each one.') : 'All ' + arts.length + ' saved.');
    } finally { b.disabled = false; }
  });

  document.querySelectorAll('button.one').forEach(function (btn, i) {
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      try {
        try { await document.fonts.ready; } catch (e) {}
        saveBlob(await toBlob(await render(arts[i])), arts[i].dataset.name);
        say('Saved ' + arts[i].dataset.name);
      } catch (e) {
        say('Failed on plate ' + (i + 1) + ': ' + (e && e.message ? e.message : e));
      } finally { btn.disabled = false; }
    });
  });
</script>
