<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Provenance Collection</title>
  <meta name="description" content="The producers in the Provenance Collection." />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#1A1B18" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    /* Private page, reached from the Collection sticker. Set in the profile
       pages' language (charcoal, Playfair, upright) with silver as the accent,
       because silver is the Collection's mark. Not linked from anywhere and
       noindex; the folder name is the key. */
    :root {
      --ground: #1A1B18; --surface: #222320;
      --hair: rgba(201,198,189,0.14); --hair-strong: rgba(201,198,189,0.28);
      --cream: #E8DEC8; --cream-soft: #CFC7B3; --muted: #9A968B;
      --silver: #DCD9D0; --green: #45704E; --green-light: #5A8C64;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--ground); }
    body {
      background: var(--ground); color: var(--cream);
      font-family: 'Source Serif 4', Georgia, serif; font-weight: 300;
      font-size: 17px; line-height: 1.72; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 1.5px solid var(--silver); outline-offset: 3px; }
    img { max-width: 100%; display: block; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
    h1, h2 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; text-wrap: balance; }
    .label {
      font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500;
      font-size: 0.64rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--silver);
    }
    header.site {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--hair); max-width: 1040px; margin: 0 auto;
    }
    .logo { font-family: 'Playfair Display', Georgia, serif; font-size: 19px; letter-spacing: 0.14em; color: var(--green); }
    .back {
      font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 0.64rem;
      letter-spacing: 0.18em; text-transform: uppercase; transition: color 0.2s;
    }
    .back:hover { color: var(--silver); }

    .hero { text-align: center; padding: 64px 0 44px; }
    .hero .ring {
      width: 74px; height: 74px; margin: 0 auto 26px; border-radius: 50%;
      border: 2px solid var(--silver); box-shadow: 0 0 18px rgba(220,217,208,0.22);
      display: flex; align-items: center; justify-content: center;
    }
    .hero .ring i { width: 14px; height: 14px; border-radius: 50%; background: #59A666; box-shadow: 0 0 8px 2px rgba(89,166,102,0.5); }
    h1 { font-size: clamp(2.3rem, 6vw, 3.2rem); line-height: 1.08; color: var(--silver); margin: 12px 0 18px; }
    .lede { color: var(--cream-soft); max-width: 520px; margin: 0 auto; }

    .count { margin: 0 0 18px; padding-top: 14px; border-top: 1px solid var(--hair); }

    .member {
      display: grid; grid-template-columns: 112px 1fr; gap: 22px; align-items: start;
      padding: 26px 0; border-top: 1px solid var(--hair);
    }
    .member:first-of-type { border-top: 0; }
    .thumb {
      aspect-ratio: 1/1; background: var(--surface); border: 1px solid var(--hair);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .thumb.on-white { background: #fff; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .marks { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .mark {
      font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 600;
      font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; line-height: 1; white-space: nowrap;
    }
    .mark + .mark { padding-left: 12px; border-left: 1px solid rgba(201,198,189,0.2); }
    .m-verified { color: #59A666; } .m-featured { color: #D9AE55; } .m-discovered { color: #4E8560; }
    .m-collection { color: var(--silver); }
    .member h2 { font-size: 1.6rem; line-height: 1.15; color: var(--cream); margin-bottom: 2px; }
    .where { color: var(--green-light); font-size: 0.95rem; }
    .produce { color: var(--cream-soft); font-size: 0.95rem; }
    .desc { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin: 10px 0 14px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 0.64rem;
      letter-spacing: 0.18em; text-transform: uppercase; padding: 10px 16px;
      border: 1px solid var(--hair-strong); color: var(--silver); transition: border-color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--silver); background: rgba(220,217,208,0.06); }
    .btn.fill { background: var(--silver); color: #1A1B18; border-color: var(--silver); }
    .btn.fill:hover { background: #f0eee8; }

    .note { text-align: center; color: var(--muted); padding: 10px 0 70px; font-size: 0.9rem; }
    .empty { text-align: center; color: var(--muted); padding: 30px 0 70px; }
    @media (max-width: 520px) {
      .member { grid-template-columns: 84px 1fr; gap: 16px; }
      .hero { padding: 44px 0 30px; }
      .member h2 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a class="logo" href="../../">PROVENANCE</a>
    <a class="back" href="../../">The map</a>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="ring"><i></i></div>
      <p class="label">Provenance Collection</p>
      <h1>The Collection</h1>
      <p class="lede">The producers set apart in the Provenance Collection. Each keeps the tier it holds on the map; the silver mark sits on top.</p>
    </section>

    <p class="label count" id="count" hidden></p>
    <div id="list"></div>
    <p class="empty" id="empty" hidden>The Collection could not be loaded. Please try again.</p>
    <p class="note">Every producer here is on the <a href="../../" style="color:var(--silver)">Provenance Map</a>.</p>
  </main>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ROOT = '../../';
    const TIER = { discovered: 'Discovered', verified: 'Provenance Verified', featured: 'Provenance Highlighted' };

    // Same rule as the map and the shared profile page.
    function profileUrl(p) {
      if (p.profile_slug && p.profile_live) return ROOT + p.profile_slug + '/';
      if (p.map_link) return ROOT + p.map_link;
      return ROOT + 'producer/?id=' + encodeURIComponent(p.id);
    }

    function card(p) {
      const tier = p.tier || 'discovered';
      const img = p.photo_url
        ? `<div class="thumb ${p.photo_bg === 'white' ? 'on-white' : ''}"><img src="${esc(ROOT + p.photo_url)}" alt="" loading="lazy"></div>`
        : `<div class="thumb"></div>`;
      const mapLink = ROOT + '?producer=' + encodeURIComponent(p.id);
      return `<article class="member">${img}<div>
        <div class="marks"><span class="mark m-${esc(tier)}">${esc(TIER[tier] || tier)}</span><span class="mark m-collection">Provenance Collection</span></div>
        <h2>${esc(p.name)}</h2>
        <p class="where">${esc(p.location || p.county)}</p>
        <p class="produce">${esc(p.product)}</p>
        <p class="desc">${esc(p.description)}</p>
        <div class="links"><a class="btn fill" href="${esc(profileUrl(p))}">See the farm</a><a class="btn" href="${esc(mapLink)}">On the map</a></div>
      </div></article>`;
    }

    fetch(ROOT + 'producers.json?v=' + Date.now(), { cache: 'no-store' })
      .then((r) => r.json())
      .then((data) => {
        const members = (data.producers || [])
          .filter((p) => p.collection)
          .sort((a, b) => a.name.localeCompare(b.name));
        if (!members.length) { document.getElementById('empty').hidden = false; return; }
        const c = document.getElementById('count');
        c.textContent = members.length + (members.length === 1 ? ' producer' : ' producers');
        c.hidden = false;
        document.getElementById('list').innerHTML = members.map(card).join('');
      })
      .catch(() => { document.getElementById('empty').hidden = false; });
  </script>
</body>
</html>
