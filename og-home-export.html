<!doctype html>
<!-- Source for assets/og/home.jpg, the link preview for provenancemap.ie.
     Regenerate: open at exactly 1200x630 and screenshot, or
       chrome --headless=new --window-size=1200,630 --force-device-scale-factor=1 \
              --screenshot=assets/og/home.jpg og-home-export.html
     Profile pages' language (charcoal, Playfair, forest green), matching
     assets/og/connect.jpg. Deliberately carries no producer count: the file
     is static and a number in it goes stale the next time a farm is added. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Inter:wght@500&family=Source+Serif+4:wght@300&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  html,body { width:1200px; height:630px; overflow:hidden; background:#1A1B18; }
  .card { position:relative; width:1200px; height:630px; }
  /* The island, bled off the right edge and faded into the ground so it
     reads as the map rather than as a pasted-on picture. */
  .isle {
    position:absolute; right:-70px; top:50%; transform:translateY(-50%);
    width:620px; height:620px; object-fit:contain;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 26%, #000 100%);
            mask-image: linear-gradient(to right, transparent 0%, #000 26%, #000 100%);
  }
  /* Open on the right, because the island bleeds off that edge: a line
     crossing the artwork reads as a mistake rather than as a frame. */
  .frame { position:absolute; inset:40px; border:1px solid rgba(201,198,189,0.14); border-right:0; }
  .text { position:absolute; left:96px; top:50%; transform:translateY(-50%); width:620px; }
  .kicker {
    font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:500;
    font-size:21px; letter-spacing:0.26em; text-transform:uppercase; color:#45704E;
  }
  h1 {
    font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:68px; line-height:1.07; color:#E8DEC8; margin:22px 0 0;
  }
  .sub {
    font-family:'Source Serif 4',Georgia,serif; font-weight:300;
    font-size:28px; line-height:1.5; color:#CFC7B3; margin-top:24px;
  }
  .rule { height:1px; background:rgba(201,198,189,0.20); margin:40px 0 24px; width:470px; }
  .url {
    font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:500;
    font-size:20px; letter-spacing:0.22em; text-transform:uppercase; color:#5A8C64;
  }
</style></head>
<body><div class="card">
  <img class="isle" src="ireland-map.png.png" alt="">
  <div class="frame"></div>
  <div class="text">
    <p class="kicker">The Provenance Map</p>
    <h1>Find the farm your<br>food came from</h1>
    <p class="sub">Real food. Named source. Verified producer.</p>
    <div class="rule"></div>
    <p class="url">provenancemap.ie</p>
  </div>
</div></body></html>
