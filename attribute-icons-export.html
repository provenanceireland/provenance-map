<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  function fit() {
    document.querySelectorAll('.stage').forEach(function (st) {
      st.querySelector('.art').style.transform = 'scale(' + (st.clientWidth / 1080) + ')';
    });
  }
  window.addEventListener('resize', fit);
  fit();

  var say = function (m) { document.getElementById('s').textContent = m; };
  var arts = Array.prototype.slice.call(document.querySelectorAll('.art'));

  async function render(art) {
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-20000px;top:0;width:1080px;height:1350px;overflow:hidden;';
    var clone = art.firstElementChild.cloneNode(true);
    host.appendChild(clone);
    document.body.appendChild(host);
    try {
      return await html2canvas(clone, { width: 1080, height: 1350, scale: 1, backgroundColor: '#1A1B18', useCORS: true, logging: false });
    } finally {
      host.remove();
    }
  }
  function toBlob(canvas) {
    return new Promise(function (res, rej) {
      canvas.toBlob(function (b) { b ? res(b) : rej(new Error('blank render')); }, 'image/png');
    });
  }
  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  document.getElementById('zip').addEventListener('click', async function () {
    var b = this; b.disabled = true;
    try {
      try { await document.fonts.ready; } catch (e) {}
      var zip = new JSZip();
      for (var i = 0; i < arts.length; i++) {
        say('Rendering ' + (i + 1) + ' of ' + arts.length + '...');
        var blob = await toBlob(await render(arts[i]));
        zip.file(arts[i].dataset.name, blob);
      }
      say('Packing the zip...');
      var out = await zip.generateAsync({ type: 'blob' });
      saveBlob(out, 'Attribute-Icons-personal.zip');
      say('Done. One zip with both plates.');
    } catch (e) {
      say('Failed: ' + (e && e.message ? e.message : e));
    } finally { b.disabled = false; }
  });

  document.getElementById('loose').addEventListener('click', async function () {
    var b = this; b.disabled = true;
    try {
      try { await document.fonts.ready; } catch (e) {}
      for (var i = 0; i < arts.length; i++) {
        say('Rendering ' + (i + 1) + ' of ' + arts.length + '...');
        saveBlob(await toBlob(await render(arts[i])), arts[i].dataset.name);
        await new Promise(function (r) { setTimeout(r, 400); });
      }
      say('Done. Both plates saved.');
    } catch (e) {
      say('Failed: ' + (e && e.message ? e.message : e));
    } finally { b.disabled = false; }
  });

  document.querySelectorAll('figure').forEach(function (fig) {
    fig.querySelector('button.one').addEventListener('click', async function () {
      var b = this; b.disabled = true;
      var art = fig.querySelector('.art');
      try {
        try { await document.fonts.ready; } catch (e) {}
        say('Rendering ' + art.dataset.name + '...');
        saveBlob(await toBlob(await render(art)), art.dataset.name);
        say('Saved ' + art.dataset.name);
      } catch (e) {
        say('Failed: ' + (e && e.message ? e.message : e));
      } finally { b.disabled = false; }
    });
  });
</script>
